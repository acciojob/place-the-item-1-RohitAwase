<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .holder{
            background-color: pink;
            display: flex;
            width: 100%;
            justify-content: space-between;
            flex-wrap: wrap;
        }
    .item{
        background-color: yellow;
        width: 50px;
        height: 50px;
        margin: 5px;
        font-size: x-large;
    }
    </style>
</head>
<body>
    <div class="holder">
        <div class="item" style="background-color: red; order: 2;">1</div>
        <div class="item" style="background-color: blue; order: 3;">2</div>
        <div class="item" style="background-color: green; order: 1;">3</div>
    </div> 
</body>
</html>
